<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>미니 포커</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18765b,#07392e);color:white;font-family:system-ui,sans-serif;text-align:center}main{max-width:850px;margin:35px auto;padding:20px}h1{font-size:2.2rem}.hint{color:#d4f5e9}.cards{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:32px 0}.card{width:112px;height:156px;border:4px solid transparent;border-radius:13px;background:#fff;color:#17232a;font-size:35px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 12px #0004;user-select:none}.card.red{color:#d72c42}.card.held{border-color:#ffd75e;transform:translateY(-10px)}.card small{font-size:14px;color:#3b4850}.card.held small{color:#aa6b00}button.action{background:#ffcf55;color:#292016;border:0;border-radius:12px;padding:14px 24px;font-weight:800;font-size:18px;cursor:pointer;margin:6px}button.action:disabled{opacity:.45;cursor:default}.status{font-size:24px;font-weight:800;min-height:36px}.stats{display:flex;justify-content:center;gap:24px;font-size:18px}footer{margin-top:25px;color:#d5eee7;font-size:14px}@media(max-width:620px){.card{width:64px;height:103px;font-size:23px}.cards{gap:4px}.card small{font-size:11px}main{padding:10px}}</style></head><body><main><h1>🃏 미니 포커</h1><p class="hint">카드 5장으로 높은 족보를 만들어 보세요! (돈이나 베팅 없음)</p><div class="stats"><span>라운드: <b id="round">0</b></span><span>총점: <b id="score">0</b></span></div><div class="cards" id="cards" aria-label="내 카드"></div><div class="status" id="status" aria-live="polite">새 게임을 눌러 시작하세요!</div><p id="help">카드를 받은 뒤 남길 카드를 클릭하세요.</p><button class="action" id="deal">새 게임 시작</button><button class="action" id="draw" disabled>선택하지 않은 카드 바꾸기</button><footer>방법: 카드 5장을 받은 뒤 보관할 카드를 클릭(노란 테두리)하고, 나머지를 한 번 바꿀 수 있어요.<br>족보: 로열 플러시 · 스트레이트 플러시 · 포카드 · 풀하우스 · 플러시 · 스트레이트 · 트리플 · 투페어 · 원페어 · 하이카드</footer></main><script>
// 카드 한 벌을 만들고 섞는 함수
const suits=['♠','♥','♦','♣'];let deck=[],hand=[],held=new Set(),round=0,score=0,phase='ready';
const $=id=>document.getElementById(id);
function newDeck(){deck=[];for(const suit of suits)for(let value=2;value<=14;value++)deck.push({suit,value});for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
function label(v){return ({11:'J',12:'Q',13:'K',14:'A'})[v]||String(v)}
function render(){ $('cards').innerHTML='';hand.forEach((c,i)=>{const el=document.createElement('button');el.className='card'+('♥♦'.includes(c.suit)?' red':'')+(held.has(i)?' held':'');el.innerHTML=`<span>${label(c.value)}${c.suit}</span><small>${held.has(i)?'✓ 보관':'클릭해 보관'}</small>`;el.disabled=phase!=='choose';el.setAttribute('aria-label',`${label(c.value)} ${c.suit} ${held.has(i)?'보관됨':'보관 안 됨'}`);el.onclick=()=>{if(held.has(i))held.delete(i);else held.add(i);render()};$('cards').appendChild(el)});$('round').textContent=round;$('score').textContent=score;$('draw').disabled=phase!=='choose';$('deal').textContent=round===0?'새 게임 시작':'다음 라운드';$('help').textContent=phase==='choose'?'남길 카드를 클릭한 후 아래 버튼을 누르세요.':phase==='done'?'다음 라운드 버튼을 눌러 계속하세요.':'새 게임을 눌러 시작하세요.'}
// 완성된 5장의 포커 족보를 계산하는 함수
function evaluate(cards){const values=cards.map(c=>c.value).sort((a,b)=>a-b);const counts={};values.forEach(v=>counts[v]=(counts[v]||0)+1);const groups=Object.values(counts).sort((a,b)=>b-a);const flush=cards.every(c=>c.suit===cards[0].suit);const unique=[...new Set(values)];const straight=unique.length===5&&(values[4]-values[0]===4||JSON.stringify(values)==='[2,3,4,5,14]');if(straight&&flush&&values[0]===10)return ['로열 플러시!',100];if(straight&&flush)return ['스트레이트 플러시!',80];if(groups[0]===4)return ['포카드!',60];if(groups[0]===3&&groups[1]===2)return ['풀하우스!',45];if(flush)return ['플러시!',35];if(straight)return ['스트레이트!',30];if(groups[0]===3)return ['트리플!',20];if(groups[0]===2&&groups[1]===2)return ['투페어!',15];if(groups[0]===2)return ['원페어!',10];return ['하이카드',0]}
$('deal').onclick=()=>{newDeck();hand=Array.from({length:5},()=>deck.pop());held.clear();round++;phase='choose';$('status').textContent='어떤 카드를 남길까요?';render()};
$('draw').onclick=()=>{if(phase!=='choose')return;hand=hand.map((c,i)=>held.has(i)?c:deck.pop());phase='done';const [name,points]=evaluate(hand);score+=points;$('status').textContent=`${name} +${points}점`;held.clear();render()};render();
</script></body></html>
